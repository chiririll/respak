name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: respak
            archive: tar.gz
          - name: win64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: respak.exe
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # Default features include `steam`, so the Steam support stays in the release build.
      - name: Build
        run: cargo build --release --locked -p respak-cli --target ${{ matrix.target }}

      - name: Package (linux)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="respak-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$name/"
          cp README* LICENSE* "$name/" 2>/dev/null || true
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "respak-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" $name
          Get-ChildItem README*, LICENSE* -ErrorAction SilentlyContinue | Copy-Item -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
