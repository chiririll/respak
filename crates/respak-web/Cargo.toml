[package]
name = "respak-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
respak-core.workspace = true
respak-host = { workspace = true }
respak-respawn.workspace = true
respak-formats.workspace = true
respak-nihav.workspace = true
respak-rad.workspace = true
axum.workspace = true
rust-embed.workspace = true
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bytes.workspace = true
opendal = { workspace = true, features = ["services-memory"] }
mime_guess = "2"
toml.workspace = true
respak-steam = { path = "../respak-steam", optional = true }

[features]
default = ["steam"]
steam = ["respak-host/steam", "dep:respak-steam"]

[dev-dependencies]
tempfile.workspace = true
respak-respawn-testing.workspace = true
tower = { version = "0.5", features = ["util"] }
png.workspace = true

[lints]
workspace = true

[[bin]]
name = "respak-web"
path = "src/main.rs"
