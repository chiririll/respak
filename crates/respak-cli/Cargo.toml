[package]
name = "respak-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
respak-core.workspace = true
respak-respawn.workspace = true
respak-formats.workspace = true
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
serde_json.workspace = true
opendal.workspace = true
respak-steam = { path = "../respak-steam", optional = true }

[features]
default = ["steam"]
# Steam login and depot input; the only Steam code in the workspace lives in respak-steam.
steam = ["dep:respak-steam"]

[dev-dependencies]
respak-respawn = { workspace = true, features = ["testing"] }
png = "0.18"
ddsfile = "0.6"

[[bin]]
name = "respak"
path = "src/main.rs"
