[package]
name = "respak-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
respak-core.workspace = true
respak-respawn.workspace = true
respak-formats.workspace = true
respak-nihav.workspace = true
respak-rad.workspace = true
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
opendal.workspace = true
tracing-subscriber.workspace = true
respak-steam = { path = "../respak-steam", optional = true }

[features]
default = ["steam"]
# Steam login and depot input; the only Steam code in the workspace lives in respak-steam.
steam = ["dep:respak-steam"]

[dev-dependencies]
respak-respawn.workspace = true
respak-respawn-testing.workspace = true
png.workspace = true
ddsfile.workspace = true
tempfile.workspace = true

[[bin]]
name = "respak"
path = "src/main.rs"
