[workspace]
members = ["crates/*", "integration"]
# `cargo build` / `cargo test` without `-p` skip the integration crate and `respak-web` (which
# needs the built frontend, hence Node).
default-members = [
    "crates/respak-cli",
    "crates/respak-core",
    "crates/respak-formats",
    "crates/respak-host",
    "crates/respak-nihav",
    "crates/respak-rad",
    "crates/respak-respawn",
    "crates/respak-respawn-testing",
    "crates/respak-steam",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
respak-core = { path = "crates/respak-core" }
respak-respawn = { path = "crates/respak-respawn" }
respak-respawn-testing = { path = "crates/respak-respawn-testing" }
respak-formats = { path = "crates/respak-formats" }
respak-nihav = { path = "crates/respak-nihav" }
respak-rad = { path = "crates/respak-rad" }
respak-host = { path = "crates/respak-host", default-features = false }

# Pre-1.0: exact pin (see docs/design/project.md §3).
opendal = { version = "=0.59.5", default-features = false, features = ["services-fs", "executors-tokio"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "signal", "time"] }
tokio-util = "0.7"
# In-memory result cache (docs/design/project.md §7); the sync cache needs no runtime.
moka = { version = "0.12", default-features = false, features = ["sync"] }
futures = "0.3"
async-trait = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bytes = "1"

png = "0.18"
ddsfile = "0.6"
bcdec_rs = "0.2.0"
tempfile = "3"

thiserror = "2"
# Oodle decoder (port of ooz, GPL-3.0+): decoding only, never the proprietary oo2core. Our fork: one fix on top of upstream dev.
oozextract = { git = "https://github.com/chiririll/oozextract", rev = "4b9423158df788d7f3e5b754d37f4c8183682af9" }
# Bink 2 demuxer and decoders (AGPL-3.0, pure Rust, not on crates.io). Our fork: upstream history plus fixes to the Bink 2 and DCT audio decoders, and a raw-block Bink Audio decoder for Miles (branch miles-bink-audio).
nihav_core = { git = "https://github.com/chiririll/nihav", rev = "c91ea6294c92f6716d1fac69949b3920f62c50ef" }
nihav_rad = { git = "https://github.com/chiririll/nihav", rev = "c91ea6294c92f6716d1fac69949b3920f62c50ef", default-features = false, features = ["demuxer_bink", "decoder_bink2", "decoder_binkaud"] }
# Video encoders and muxers (AVI + MJPEG for now), the same fork and revision.
nihav_commonfmt = { git = "https://github.com/chiririll/nihav", rev = "c91ea6294c92f6716d1fac69949b3920f62c50ef", default-features = false, features = ["muxer_avi", "muxer_mov", "muxer_y4m", "encoder_jpeg", "encoder_cinepak", "encoder_rawvideo", "encoder_zmbv"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

clap = { version = "4", features = ["derive"] }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
rust-embed = "8"

[workspace.lints.rust]
missing_docs = "warn"
