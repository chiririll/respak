[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
respak-core = { path = "crates/respak-core" }
respak-respawn = { path = "crates/respak-respawn" }
respak-formats = { path = "crates/respak-formats" }

# Pre-1.0: exact pin (see todo/PROJECT.md §3).
opendal = { version = "=0.59.4", default-features = false, features = ["services-fs", "executors-tokio"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

thiserror = "2"
tracing = "0.1"

clap = { version = "4", features = ["derive"] }
anyhow = "1"

[workspace.lints.rust]
missing_docs = "warn"
