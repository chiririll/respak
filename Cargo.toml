[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
respak-core = { path = "crates/respak-core" }
respak-respawn = { path = "crates/respak-respawn" }
respak-formats = { path = "crates/respak-formats" }

# Pre-1.0: exact pin (see todo/PROJECT.md §3).
opendal = { version = "=0.59.4", default-features = false, features = ["services-fs", "executors-tokio"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "signal"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

thiserror = "2"
# Oodle decoder (port of ooz, GPL-3.0+): decoding only, never the proprietary oo2core. Our fork: one fix on top of upstream dev.
oozextract = { git = "https://github.com/chiririll/oozextract", rev = "4b9423158df788d7f3e5b754d37f4c8183682af9" }
# Bink 2 demuxer and decoders (AGPL-3.0, pure Rust, not on crates.io). Our fork: upstream history plus one fix to the DCT audio decoder.
nihav_core = { git = "https://github.com/chiririll/nihav", rev = "895ba0d04ec36e1b9246b818484393a3e516cc75" }
nihav_rad = { git = "https://github.com/chiririll/nihav", rev = "895ba0d04ec36e1b9246b818484393a3e516cc75", default-features = false, features = ["demuxer_bink", "decoder_bink2", "decoder_binkaud"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

clap = { version = "4", features = ["derive"] }
anyhow = "1"

[workspace.lints.rust]
missing_docs = "warn"
